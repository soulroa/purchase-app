<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>소액구매 신규 신청</title>
    <style>
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            margin: 0; 
            background-color: #f4f4f9; 
            display: flex;
            justify-content: center;
        }
        .container { 
            background: white; 
            padding: 30px 20px; 
            width: 100%; 
            max-width: 600px; /* PC에서도 너무 넓어지지 않게 방어 */
            box-sizing: border-box;
            min-height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h2 { margin: 0; font-size: 22px; color: #222; }
        .btn-back {
            background: none;
            border: 1px solid #ccc;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        .required { color: red; }
        
        /* 60대 맞춤 큼직한 입력칸 */
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 18px;
            box-sizing: border-box;
            background-color: #fff;
        }
        
        /* 사진 첨부 버튼 커스텀 */
        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-upload-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
        }
        .btn-upload {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 8px;
            font-size: 18px;
            width: 100%;
            pointer-events: none;
        }
        #fileNameDisplay {
            display: block;
            margin-top: 10px;
            font-size: 16px;
            color: #0056b3;
            word-break: break-all;
        }

        .btn-submit { 
            width: 100%; 
            padding: 25px; 
            background-color: #0056b3; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 24px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 20px;
            margin-bottom: 50px;
        }
        .btn-submit:disabled { background-color: #aaa; }
        
        /* 로딩 오버레이 */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 24px;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
    </style>
    <!-- PWA 매니페스트 및 테마 컬러 연결 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0056b3">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- 서비스 워커 등록 스크립트 -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker 등록 성공:', reg.scope))
                    .catch(err => console.log('Service Worker 등록 실패:', err));
            });
        }
    </script>
</head>
<body>
    <div id="loadingOverlay">데이터 전송 중... <br>잠시만 기다려주세요.</div>
    
    <div class="container">
        <div class="header">
            <h2>소액구매 신규 신청</h2>
            <button class="btn-back" onclick="location.href='menu.html'">뒤로</button>
        </div>

        <div class="form-group">
            <label>관할 부서 <span class="required">*</span></label>
            <select id="deptSelect" onchange="syncLocation()">
                <option value="">부서를 선택하세요</option>
            </select>
        </div>

        <div class="form-group">
            <label>품목명 <span class="required">*</span></label>
            <input type="text" id="item" placeholder="예: 화장실 환풍기">
        </div>

        <div class="form-group">
            <label>규격 (선택사항)</label>
            <input type="text" id="spec" placeholder="예: 30x30cm, 대형 등">
        </div>

        <div class="form-group">
            <label>수량 <span class="required">*</span></label>
            <input type="text" id="qty" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/^0+/, '');" placeholder="숫자만 입력">
        </div>

        <div class="form-group">
            <label>구매신청사유 <span class="required">*</span></label>
            <input type="text" id="reason" placeholder="예: 기존 환풍기 고장으로 교체">
        </div>

        <div class="form-group">
            <label>수령 희망장소 <span class="required">*</span></label>
            <!-- 부서 선택 시 이 칸에 부서명이 자동 복사됩니다 -->
            <input type="text" id="location" placeholder="부서를 선택하면 자동 입력됩니다">
        </div>

        <div class="form-group">
            <label>사진 첨부 (스마트폰은 카메라 자동 연결)</label>
            <div class="file-upload-wrapper">
                <button class="btn-upload">📷 사진 촬영 또는 파일 선택</button>
                <!-- accept="image/*" 와 capture="environment"로 스마트폰 후면 카메라 강제 호출 -->
                <input type="file" id="photo" accept="image/*" capture="environment" onchange="handleFileSelect(event)">
            </div>
            <span id="fileNameDisplay">선택된 사진 없음</span>
        </div>

        <button id="submitBtn" class="btn-submit" onclick="submitData()">신청서 제출하기</button>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwbRhTB_I99-_EFHbnqTyKPCEd5_lIWJdEQj8OPu3itKzzJSN-RyzGUsaL-rtR1ZHj6/exec';
        let base64Photo = "";

        // 1. 화면 진입 시 권한 확인 및 부서 목록 세팅
        window.onload = function() {
            const empNo = localStorage.getItem('empNo');
            const deptsStr = localStorage.getItem('depts');
            
            if (!empNo || !deptsStr) {
                alert('인증 정보가 없습니다. 첫 화면으로 이동합니다.');
                window.location.href = 'index.html';
                return;
            }

            const depts = JSON.parse(deptsStr);
            const deptSelect = document.getElementById('deptSelect');
            
            depts.forEach(dept => {
                let option = document.createElement('option');
                option.value = dept;
                option.text = dept;
                deptSelect.appendChild(option);
            });
        };

        // 2. 부서 선택 시 '수령 희망장소' 자동 동기화 로직
        function syncLocation() {
            const dept = document.getElementById('deptSelect').value;
            const locationInput = document.getElementById('location');
            if(dept !== "") {
                locationInput.value = dept; // 값 복사
            }
        }

// 3. 사진 파일 압축 처리 (해상도 및 용량 최적화)
        function handleFileSelect(event) {
            const file = event.target.files[0];
            const display = document.getElementById('fileNameDisplay');
            
            if (file) {
                display.innerText = "선택됨: " + file.name + " (압축 중...)";
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        // 최대 가로/세로 길이 지정 (1024px 수준이면 서류 확인용으로 충분함)
                        const MAX_SIZE = 1024;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_SIZE) {
                                height *= MAX_SIZE / width;
                                width = MAX_SIZE;
                            }
                        } else {
                            if (height > MAX_SIZE) {
                                width *= MAX_SIZE / height;
                                height = MAX_SIZE;
                            }
                        }

                        // 가상 캔버스에 리사이징된 이미지 그리기
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // 압축된 이미지를 Base64로 변환 (JPEG 형식, 품질 70%)
                        base64Photo = canvas.toDataURL('image/jpeg', 0.7);
                        display.innerText = "선택됨: " + file.name + " (압축 준비 완료)";
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file); 
            } else {
                display.innerText = "선택된 사진 없음";
                base64Photo = "";
            }
        }

        // 4. 데이터 묶어서 백엔드로 제출
        async function submitData() {
            const empNo = localStorage.getItem('empNo');
            const empName = localStorage.getItem('empName');
            const dept = document.getElementById('deptSelect').value;
            const item = document.getElementById('item').value.trim();
            const spec = document.getElementById('spec').value.trim();
            const qty = document.getElementById('qty').value.trim();
            const reason = document.getElementById('reason').value.trim();
            const location = document.getElementById('location').value.trim();

            // 유효성 검사 (누락 항목 특정하여 안내)
            let missingFields = [];
            if (!dept) missingFields.push('관할 부서');
            if (!item) missingFields.push('품목명');
            if (!qty) missingFields.push('수량');
            if (!reason) missingFields.push('구매신청사유');
            if (!location) missingFields.push('수령 희망장소');

            if (missingFields.length > 0) {
                alert('다음 필수 항목이 누락되었습니다.\n\n- ' + missingFields.join('\n- '));
                return;
            }

            // UI 잠금 (중복 제출 방지)
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('loadingOverlay').style.display = 'flex';

            const payload = {
                empNo: empNo,
                name: empName,
                dept: dept,
                item: item,
                spec: spec,
                qty: qty,
                reason: reason,
                location: location,
                imageBase64: base64Photo // 사진이 없으면 빈 문자열 전송
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();

                if (result.status === 'success') {
                    alert('성공적으로 신청되었습니다!');
                    window.location.href = 'menu.html'; // 완료 후 메뉴로 복귀
                } else if (result.status === 'auth_fail') {
                    // 보안 로직 발동 시 (퇴사 처리됨)
                    alert(result.message);
                    localStorage.clear();
                    window.location.href = 'index.html';
                } else {
                    alert('전송 실패: ' + result.message);
                    resetUI();
                }
            } catch (error) {
                alert('통신 오류: 사진 용량이 너무 크거나 인터넷이 불안정합니다.');
                resetUI();
            }
        }

        function resetUI() {
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('loadingOverlay').style.display = 'none';
        }
    </script>
</body>
</html>
